	<head>

	<body onload="javascript:init();" style="margin:0px;">

			</ul>
			<!-- 功能 -->
			<ul>
				<li><a id="set-button" class="btn btn--checked btn--round" href="javascript:void(0);" data-i18n-key="setAmount"></a></li>

				<li><a id="reset" class="btn btn--primary btn--round" href="javascript:void(0);" data-i18n-key="clearAll"></a></li>
				<li><a id="open-image-btn" class="btn btn--primary btn--round" href="javascript:void(0);" style="color: #39C5BB;" data-i18n-key="generateImage"></a></li>
			</ul>

		<canvas id="canvas" width="100%" height="auto" align="center"></canvas>

			<div class="usage-guide">
